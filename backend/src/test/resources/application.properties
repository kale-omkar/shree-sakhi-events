# In-memory H2 database in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:sakhi_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Safety: Real email sending disabled by default in test suite
app.mail.enabled=false
app.enquiry.recipient-email=shreesakhi26@gmail.com
