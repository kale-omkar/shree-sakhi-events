# Server
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (reads from .env or environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sakhi_events_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Application name
spring.application.name=sakhi-events-backend

# ==============================================================
# Enquiry & Email Notification Configuration
# All enquiry notifications must be sent to: shreesakhi26@gmail.com
# Credentials are read strictly from environment variables (NEVER hardcoded)
# ==============================================================
app.enquiry.recipient-email=${ENQUIRY_RECIPIENT_EMAIL:shreesakhi26@gmail.com}

# Mail / SMTP Properties (Configured via env vars; no secrets hardcoded)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}

# Development safety flag: Set to false by default to prevent sending real emails during development
app.mail.enabled=${ENABLE_EMAIL_SENDING:false}
