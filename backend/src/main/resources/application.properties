# Server
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (reads from .env or environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sakhi_events_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Application name
spring.application.name=sakhi-events-backend

# ── Jatin Patil – Booking Module Config ─────────────────────────────────────
# Payment mode: mock (default — no real money) | sandbox (Razorpay test keys)
# Pending client confirmation: switch to sandbox once merchant account is ready
payment.mode=${PAYMENT_MODE:mock}

# Booking reference prefix (e.g. SSE-2026-0001)
booking.ref.prefix=${BOOKING_REF_PREFIX:SSE}
